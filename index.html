<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#07090d" />
<title>NEMO : 17:32</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <section id="titleScreen" class="screen active">
    <div class="scanlines"></div>
    <div class="title-wrap">
      <div class="eyebrow">N.E.M.O. OBSERVATION NETWORK / CLASSIFIED</div>
      <h1>NEMO <span>: 17:32</span></h1>
      <p class="tagline">この17分だけは、誰にも渡さない。</p>
      <div class="title-actions">
        <button id="startBtn" class="primary">NEW RECORD</button>
        <button id="continueBtn">CONTINUE</button>
        <button id="extraBtn">EXTRA / 非正史</button>
      </div>
      <div class="version">COMPLETE v0.4.0 / PC WEB NOVEL</div>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <header class="topbar">
      <div class="system-id"><span class="dot"></span><span id="chapterLabel">PROLOGUE / 観測者</span></div>
      <div class="top-actions">
        <button id="saveBtn" class="small">SAVE</button>
        <button id="loadBtn" class="small">LOAD</button>
        <button id="logBtn" class="small">LOG</button>
        <button id="soundBtn" class="small">SOUND ON</button>
        <button id="titleBtn" class="small">TITLE</button>
      </div>
    </header>

    <main id="stage">
      <div id="bgLayer"></div>
      <div id="pulseLayer"></div>
      <div class="vignette"></div>
      <div id="systemOverlay" class="system-overlay hidden"></div>
      <div id="choiceBox" class="choice-box hidden"></div>

      <div id="textbox" class="textbox">
        <div id="speaker" class="speaker hidden"></div>
        <div id="text" class="text"></div>
        <div id="advanceHint" class="advance-hint">CLICK / ENTER</div>
      </div>
    </main>
  </section>

  <div id="logPanel" class="panel hidden">
    <div class="panel-inner">
      <div class="panel-head">
        <h2>BACKLOG</h2>
        <button id="closeLogBtn">CLOSE</button>
      </div>
      <div id="logContent" class="log-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="script.js"></script>
</body>
</html>
