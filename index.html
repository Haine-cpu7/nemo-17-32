/* v0.5.1 inline safety override for mobile title grid */
@media (max-width: 760px){
  .title-actions{
    display:grid !important;
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    grid-auto-rows:minmax(72px,auto) !important;
    gap:10px !important;
    width:100% !important;
  }
  .title-actions > button{
    width:100% !important;
    min-width:0 !important;
    min-height:72px !important;
    margin:0 !important;
    padding:10px 8px !important;
    grid-column:auto !important;
    font-size:clamp(11px,3.2vw,14px) !important;
    line-height:1.25 !important;
    text-align:center !important;
    white-space:normal !important;
    overflow-wrap:anywhere !important;
  }
  .title-actions > button:nth-child(1){grid-row:1;grid-column:1;}
  .title-actions > button:nth-child(2){grid-row:1;grid-column:2;}
  .title-actions > button:nth-child(3){grid-row:2;grid-column:1;}
  .title-actions > button:nth-child(4){grid-row:2;grid-column:2;}
  .title-actions > button:nth-child(5){grid-row:3;grid-column:1;}
  .title-actions > button:nth-child(6){grid-row:3;grid-column:2;}
  .title-actions > button:nth-child(7){grid-row:4;grid-column:1 / -1;}
}
</style>

<body>
<div id="app">
  <section id="titleScreen" class="screen active">
    <div class="scanlines"></div>
    <div class="title-wrap">
      <div class="eyebrow">N.E.M.O. OBSERVATION NETWORK / CLASSIFIED</div>
      <h1>NEMO <span>: 17:32</span></h1>
      <p class="tagline">この17分だけは、誰にも渡さない。</p>
      <div class="title-actions">
        <button id="startBtn" class="primary">NEW RECORD</button>
        <button id="continueBtn">CONTINUE</button>
        <button id="extraBtn" disabled>EXTRA RECORD I / LOCKED</button>
        <button id="extra2Btn" disabled>EXTRA RECORD II / LOCKED</button>
        <button id="extra3Btn" disabled>EXTRA RECORD III / LOCKED</button>
        <button id="extra4Btn" disabled>EXTRA RECORD IV / LOCKED</button>
        <button id="extra5Btn" disabled>EXTRA RECORD V / LOCKED</button>
      </div>
      <div class="version">COMPLETE v0.5.5 / PC & MOBILE WEB NOVEL</div>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <header class="topbar">
      <div class="system-id"><span class="dot"></span><span id="chapterLabel">PROLOGUE / 観測者</span></div>
      <div class="top-actions">
        <button id="saveBtn" class="small">SAVE</button>
        <button id="loadBtn" class="small">LOAD</button>
        <button id="logBtn" class="small">LOG</button>
        <button id="soundBtn" class="small">SOUND ON</button>
        <button id="titleBtn" class="small">TITLE</button>
      </div>
    </header>

    <main id="stage">
      <div id="bgLayer"></div>
      <div id="pulseLayer"></div>
      <div class="vignette"></div>
      <div id="systemOverlay" class="system-overlay hidden"></div>
      <div id="choiceBox" class="choice-box hidden"></div>

      <div id="textbox" class="textbox">
        <div id="speaker" class="speaker hidden"></div>
        <div id="text" class="text"></div>
        <div id="advanceHint" class="advance-hint">CLICK / ENTER</div>
      </div>
    </main>
  </section>

  <div id="logPanel" class="panel hidden">
    <div class="panel-inner">
      <div class="panel-head">
        <h2>BACKLOG</h2>
        <button id="closeLogBtn">CLOSE</button>
      </div>
      <div id="logContent" class="log-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="script.js?v=0.5.5"></script>
